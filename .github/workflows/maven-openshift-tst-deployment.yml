name: Maven Project Deployment to openshift-tst

# Same as maven-deploy.yml, but Docker images are built with docker/bake-action from a docker-bake.hcl
# in the repository root or maven-project-dir, or a generated one. The bake file gets this variable from the workflow:
#   IMAGE_TAG  Maven project version, plus "-<short sha>" for SNAPSHOT versions,
#              e.g. 1.4.0-SNAPSHOT-abc1234 or 1.4.0

on:
  workflow_call:
    inputs:
      time-zone:
        required: false
        default: "Europe/Amsterdam"
        type: string
      timeout-minutes:
        required: false
        default: 10
        type: number
      maven-project-dir:
        description: "Folder of the Maven project, relative to the repository root. Use it when the project is not in the root."
        required: false
        default: "."
        type: string
      k8s-workloads:
        description: "Update the image tag in k8s-workloads after pushing the images"
        required: false
        default: true
        type: boolean
      k8s-workloads-project:
        description: "Folder in k8s-workloads with the kustomization files of this project. Default: the repository name."
        required: false
        default: ""
        type: string

jobs:
  tst-deployment:
    name: Maven deploy, Docker build & openshift-tst deploy
    # One run per repository at a time, so an older run can't deploy after a newer one
    concurrency: openshift-tst-${{ github.repository }}-${{ inputs.maven-project-dir }}
    runs-on: ubuntu-26.04
    timeout-minutes: ${{ inputs.timeout-minutes }}
    defaults:
      run:
        working-directory: ${{ inputs.maven-project-dir }}
    env:
      TZ: ${{ inputs.time-zone }}
      MAVEN_ARGS: '--no-transfer-progress --color always'
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # A project without a Dockerfile or bake file (such as a library) gets no Docker image and no k8s-workloads update
      - name: Check for Dockerfile
        id: dockerfile
        run: |
          if [[ -f docker-bake.hcl || -n "$(find . -name Dockerfile -not -path '*/target/*' -print -quit)" ]]; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "No docker-bake.hcl and no Dockerfile found: skipping the Docker image."
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi

      - name: AWS Credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          aws-region: eu-west-1
          role-to-assume: arn:aws:iam::917951871879:role/GitHubActionsBgOrg

      - name: Get CodeArtifact Authorization Token
        run: |
          codeartifact_auth_token=$(aws codeartifact  get-authorization-token --domain nisv-ateam --domain-owner 917951871879 --region eu-west-1 --query authorizationToken --output text)
          echo "::add-mask::$codeartifact_auth_token"
          echo "CODEARTIFACT_AUTH_TOKEN=$codeartifact_auth_token" >> "$GITHUB_ENV"

      - name: Set up JDK
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          distribution: 'temurin'
          java-version-file: '${{ inputs.maven-project-dir }}/.java-version'
          cache: 'maven'
          cache-dependency-path: '${{ inputs.maven-project-dir }}/pom.xml'

      - name: Set Maven settings.xml
        run: echo "${{ vars.MAVEN_CODEARTIFACT_SETTINGS_V2 }}" | base64 --decode > ~/.m2/settings.xml

      - name: Find or create docker-bake.hcl
        if: steps.dockerfile.outputs.found == 'true'
        id: bake-file
        uses: beeldengeluid/gha-workflows/.github/actions/docker-bake-file@a989d7d5c9312f8c874c375ecf10a3ffa50aecfb # docker-bake-file
        with:
          working-directory: ${{ inputs.maven-project-dir }}

      - name: Maven Deploy
        run: |
          mvn clean deploy -B -U -V -fae -ntp -DskipTests|| { echo "Maven Deploy failed."; exit 1; }

      - name: ECR Login
        if: steps.dockerfile.outputs.found == 'true'
        uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2.1.7

      - name: Log in to GHCR
        if: steps.dockerfile.outputs.found == 'true'
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ secrets.GH_USER }}
          password: ${{ secrets.GH_PAT }}

      - name: Generate a token
        if: inputs.k8s-workloads && steps.dockerfile.outputs.found == 'true'
        id: generate-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.BG_APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          repositories: ${{ github.event.repository.name }}, k8s-workloads

      - name: Get image tag
        if: steps.dockerfile.outputs.found == 'true'
        id: image-tag
        # Only snapshot versions get the short commit SHA, e.g. 1.4.0-SNAPSHOT-abc1234
        run: |
          IMAGE_TAG=$(MAVEN_ARGS="" mvn -B -q help:evaluate -Dexpression=project.version -DforceStdout)
          if [[ "$IMAGE_TAG" == *-SNAPSHOT ]]; then IMAGE_TAG="$IMAGE_TAG-${GITHUB_SHA::7}"; fi
          echo "image-tag=$IMAGE_TAG" >> "$GITHUB_OUTPUT"

      - name: Build and push Docker images
        if: steps.dockerfile.outputs.found == 'true'
        id: bake
        uses: docker/bake-action@59cb1203cd42bcefd40a1b6d73b589e48c86040e # v7.5.0
        env:
          IMAGE_TAG: ${{ steps.image-tag.outputs.image-tag }}
        with:
          source: ${{ inputs.maven-project-dir }}
          files: ${{ steps.bake-file.outputs.path }}
          push: true
          provenance: false

      - name: Trigger workflows for auto deployment
        if: inputs.k8s-workloads && steps.dockerfile.outputs.found == 'true'
        env:
          GH_TOKEN: ${{ steps.generate-token.outputs.token }}
          METADATA: ${{ steps.bake.outputs.metadata }}
          REPOSITORY: ${{ github.event.repository.name }}
          K8S_PROJECT: ${{ inputs.k8s-workloads-project }}
        run: |
          # One deployment per pushed image (<full image name>:<tag>), matched on newName in kustomization.yml
          for IMAGE in $(jq -r '.[] | objects | .["image.name"] // empty | split(",")[0]' <<< "$METADATA"); do
            echo "Update image for deployment script of test environment: $IMAGE"
            gh workflow run update-maven-projects-image-tag.yml \
              -r main \
              -R github.com/beeldengeluid/k8s-workloads \
              -f project="${K8S_PROJECT:-${REPOSITORY,,}}" \
              -f environments=tst \
              -f image_name="${IMAGE%:*}" \
              -f image_tag="${IMAGE##*:}"
          done
