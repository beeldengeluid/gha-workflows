name: Docker bake file
description: >-
  Use docker-bake.hcl from the repository root, or create a default one with a target per folder
  that has a Dockerfile. The image goes to <ECR>/<repository name>/<folder>, where <folder> is the path from the
  repository root to the folder of the Dockerfile, and a "<repository name>-" prefix is dropped from it
  (musicweb-fallback-api -> musicweb-fallback/api; flink-jobs with working-directory musicweb-doc5 ->
  flink-jobs/musicweb-doc5). A Dockerfile in the repository root goes to <ECR>/<repository name>. Tags use ${IMAGE_TAG}.
  With working-directory, the search and the generated file work from that folder, which is also the folder where the
  bake step runs, so a generated context is relative to it.

inputs:
  working-directory:
    description: Folder to look in, relative to the repository root
    required: false
    default: "."

outputs:
  path:
    description: Path of the bake file to use
    value: ${{ steps.bake-file.outputs.path }}

runs:
  using: composite
  steps:
    - name: Find or create docker-bake.hcl
      id: bake-file
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        REPOSITORY: ${{ github.event.repository.name }}
        WORKING_DIRECTORY: ${{ inputs.working-directory }}
      run: |
        if [[ -f docker-bake.hcl ]]; then echo "path=docker-bake.hcl" >> "$GITHUB_OUTPUT"; exit 0; fi

        mapfile -t dirs < <(find . -name Dockerfile -not -path '*/target/*' -printf '%h\n' | sort)
        (( ${#dirs[@]} > 0 )) || { echo "::error::No docker-bake.hcl and no Dockerfile found."; exit 1; }

        prefix="917951871879.dkr.ecr.eu-west-1.amazonaws.com/${REPOSITORY,,}"
        wd="${WORKING_DIRECTORY#./}"; wd="${wd%/}"; [[ "$wd" == . ]] && wd=""

        targets=()
        {
          echo 'variable "IMAGE_TAG" {}'
          for dir in "${dirs[@]}"; do
            # Path from the repository root to the folder of the Dockerfile: working-directory plus the folder in it.
            # Image names must be lowercase; the context keeps "$dir".
            sub="${dir#./}"; [[ "$dir" == . ]] && sub=""
            folder="${wd:+$wd/}$sub"; folder="${folder%/}"; folder="${folder,,}"
            image="$prefix${folder:+/${folder#"${REPOSITORY,,}"-}}"
            target="${image#*/}"; target="${target//[^a-z0-9_-]/-}"
            targets+=("\"$target\"")
            printf 'target "%s" {\n  context = "%s"\n  tags    = ["%s:${IMAGE_TAG}"]\n}\n' "$target" "$dir" "$image"
          done
          echo "group \"default\" { targets = [$(IFS=,; echo "${targets[*]}")] }"
        } > "$RUNNER_TEMP/docker-bake.hcl"
        cat "$RUNNER_TEMP/docker-bake.hcl"
        echo "path=$RUNNER_TEMP/docker-bake.hcl" >> "$GITHUB_OUTPUT"
